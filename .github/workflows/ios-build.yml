# Compiles the app. Nobody on this project works at a Mac day to day, so this
# run is the only place the Swift is ever built: a red run here means the app
# does not compile, whatever the diff looked like.
name: iOS build

on:
  push:
    paths:
      - "OperaApp/**"
      - "OperaApp.xcodeproj/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for the iOS simulator
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project OperaApp.xcodeproj \
            -scheme OperaApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log"

      - name: What failed
        if: failure()
        run: |
          # Only the errors, each once. The raw log ends in compiler command
          # lines thousands of characters long, which bury them.
          echo "---- distinct errors ----"
          grep -E "error:" "$RUNNER_TEMP/build.log" | sed -E "s#^$GITHUB_WORKSPACE/##" | sort -u | head -150
          echo "---- which steps failed ----"
          sed -n '/The following build commands failed/,$p' "$RUNNER_TEMP/build.log" | cut -c1-160
