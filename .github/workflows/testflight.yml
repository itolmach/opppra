# Archives, signs and uploads a build to TestFlight. Started by hand.
#
# Needs three repository secrets (Settings -> Secrets and variables ->
# Actions), all from one App Store Connect API key with the Admin role, made
# at App Store Connect -> Users and Access -> Integrations:
#   ASC_KEY_ID        the key's ID
#   ASC_ISSUER_ID     the issuer ID shown above the list of keys
#   ASC_PRIVATE_KEY   the whole contents of the downloaded .p8 file
# and an app record for the bundle id in App Store Connect. Signing is
# Apple's cloud-managed kind: no certificate or profile is stored anywhere.
name: TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Archive, sign and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::The $name secret is not set. See the top of this workflow file."
              exit 1
            fi
          done

          key="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          trap 'rm -f "$key"' EXIT
          ( umask 077; printf '%s\n' "$ASC_PRIVATE_KEY" > "$key" )
          auth=(-allowProvisioningUpdates
                -authenticationKeyPath "$key"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")

          # The run number is the build number: always rising, never reused.
          xcodebuild archive \
            -project OperaApp.xcodeproj \
            -scheme OperaApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/OperaApp.xcarchive" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            "${auth[@]}" -quiet

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/OperaApp.xcarchive" \
            -exportOptionsPlist OperaApp/Config/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            "${auth[@]}"
